<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&display=swap">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Business Stock Manager Pro</title>
<style>
:root{--bg:#f3f5f9;--card:#ffffff;--line:#edf0f5;--txt:#111827;--mut:#6b7280;--g:#0fa37f;--r:#e5484d;--ac:#0fa37f}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Noto Nastaliq Urdu",sans-serif;background:var(--bg);color:var(--txt);padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(140px + env(safe-area-inset-bottom,0px))}
header{padding:14px 16px;font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.cards{padding:0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.card small{color:var(--mut);font-size:12px}
.card b{display:block;font-size:17px;margin-top:4px}
.pos{color:var(--g)}.neg{color:var(--r)}
.nav{display:flex;gap:8px;overflow-x:auto;padding:12px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 12px;font-size:13px;white-space:nowrap}
.nav button.on{background:var(--ac);border-color:var(--ac)}
main{padding:0 12px 90px}
h3{margin:14px 0 8px;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--mut);font-weight:500}
.row{display:flex;gap:8px;margin:8px 0;align-items:center;flex-wrap:wrap}
input,select{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px;font-size:14px;min-width:0}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 12px;font-size:14px}
.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.danger{background:var(--r);width:100%;margin-top:6px}
.del{background:none;border:0;color:var(--r);font-size:14px}
.low{color:var(--r)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
#modal.show{display:flex}
#box{background:var(--card);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
.brand{color:var(--ac);font-weight:800;font-size:19px}
.nav button{border-radius:20px !important}
.nav button.on{color:#fff}
.hero{background:linear-gradient(135deg,var(--c2,#1e2a3a),var(--ac,#0fa37f));color:#fff;border-radius:18px;padding:18px;margin-top:4px}
.hero .hl{font-size:12px;letter-spacing:1px;opacity:.7}
.hero .hv{font-size:30px;font-weight:700;margin:6px 0}
.hero .hp{font-size:13px;font-weight:600;background:rgba(255,255,255,.12);display:inline-block;padding:4px 10px;border-radius:20px}
.hero .hp.pos{color:#4ade80}.hero .hp.neg{color:#ff8a8a}
.hero .hrow{display:flex;justify-content:space-between;margin-top:14px;border-top:1px solid rgba(255,255,255,.15);padding-top:12px}
.hero small{opacity:.7;font-size:12px}
.hero b{display:block;font-size:17px;margin-top:2px}
.grid3{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.card{box-shadow:0 1px 3px rgba(0,0,0,.05)}
#bnav{position:fixed;bottom:64px;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
#bnav button{background:none;border:0;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;flex:1}
#bnav button.on{color:var(--ac);font-weight:600}
#bnav i{font-style:normal;font-size:18px}
.btn:active{transform:scale(.96);opacity:.8}
.nav{display:none !important}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;background:#111827;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .3s;z-index:9;pointer-events:none;white-space:nowrap}
.grid3>.card:last-child:nth-child(odd){grid-column:span 2}
#splash{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:20}
#splash.show{display:flex}
header .row .btn{padding:6px 7px;font-size:12px;white-space:nowrap}

/* Full-screen pages: stay above the bottom tabs and the Netlify badge, with room at the bottom */
#modal,#picker,#plist,#seov,#imp,#tbox,#authov,#tsheet{z-index:1000 !important}
#box{max-height:100vh !important;height:100vh !important;border-radius:0 !important;padding-bottom:180px !important;box-sizing:border-box !important}
#picker,#plist,#seov,#imp,#tbox,#authov{padding-bottom:110px !important;box-sizing:border-box !important}
#picker{overflow-y:auto !important}
#tsheet>div{padding-bottom:180px !important}
.pdfrep{position:fixed;inset:0;z-index:3000;background:#fff;color:#000;overflow:auto;padding:14px;box-sizing:border-box;font-size:13px}
.pdfrep table{width:100%;border-collapse:collapse}
.pdfrep th,.pdfrep td{border-bottom:1px solid #ddd;padding:6px 4px;text-align:left;vertical-align:top}
.pdfrep thead th{background:#f3f4f6}
@media print{body>*:not(#pdfrep){display:none !important}#pdfrep{position:static !important;overflow:visible !important;padding:0 !important}.noprint{display:none !important}}
</style>

render=function(){_renderBase();applyLang();};
applyLangDoc();
render();
</script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js">const _renderBase=render;
render=function(){_renderBase();applyLang();};
applyLangDoc();
render();
</script>

applyLangDoc();

<body>
<div id="authov" style="display:none;position:fixed;inset:0;z-index:2000;background:#f5ece8;padding:20px;box-sizing:border-box;overflow:auto">
  <h3>Cloud login</h3>
  <p style="color:var(--mut)">Data aapke account mein save hoga, aur kisi bhi device par login karke wahi data dikhega.</p>
  <input id="aem" type="email" placeholder="Email" autocomplete="username" style="width:100%;margin-top:8px">
  <input id="apw" type="password" placeholder="Password (kam se kam 6 akshar)" autocomplete="current-password" style="width:100%;margin-top:8px">
  <button class="btn" onclick="authLogin()" style="width:100%;margin-top:10px">Login</button>
  <button class="btn ghost" onclick="authSignup()" style="width:100%;margin-top:8px">Naya account banayein</button>
  <button class="btn ghost" onclick="authLocal()" style="width:100%;margin-top:8px">Bina login ke (sirf is browser mein)</button>
  <div id="authinfo" style="margin-top:12px;color:var(--mut);font-size:13px"></div>
</div>
<header>
  <span class="brand" id="brandWrap" style="display:flex;align-items:center;gap:8px"><span id="brandLogo"></span><span id="brandT">Stock Manager Pro</span></span>
  <span class="row" style="margin:0;flex-wrap:nowrap;gap:4px"><button class="btn ghost" onclick="cycleLang()" style="font-size:12px;padding:6px 8px">RU</button>
    <button class="btn ghost" onclick="showAuth()">Cloud</button><button class="btn ghost" onclick="backup()">Backup</button><button class="btn ghost" onclick="restoreData()">Restore</button>
    <button class="btn ghost" onclick="demo()">Demo</button>
    <button class="btn ghost" onclick="reset()">Reset</button>
  </span>
</header>
<div class="cards" id="cards"></div>
<div class="nav" id="nav"></div>
<main id="main"></main>
<div id="splash"></div>
<div id="toast"></div>
<div id="bnav"></div>
<div id="modal"><div id="box"></div></div>

<script>
const KEY='bsmp_v1',$=i=>document.getElementById(i),sum=a=>a.reduce((x,y)=>x+y,0);
const fmt=n=>'Rs '+Math.round(n||0).toLocaleString('en-PK');
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const dstr=s=>new Date(s).toLocaleDateString('en-GB',{timeZone:'Asia/Karachi'});
const todayKey=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Karachi'});
const blank=()=>({products:[],customers:[],suppliers:[],holders:[],txns:[],cash:0,bank:0,auth:0});
let LANG=localStorage.getItem('smp_lang')||'rur';
let S;try{S=JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){S=blank()}
function migrateFree(){
  let n=0;
  (S.txns||[]).forEach(t=>{if(t.type=='adjust'&&t.dir<0&&!t.rv){const cp=S.customers.find(x=>x.id==t.pid||x.name==t.party);if(cp)cp.bal+=t.total;t.rv=true;n++;}});
  return n;
}
migrateFree();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(typeof cloudQueue=='function')cloudQueue();};
const money=(m,a)=>{if(m=='bank')S.bank+=a;else S.cash+=a;};
const addTx=(type,total,method,party,x={})=>{const t={id:uid(),type,total,method,party,day:todayKey(),date:new Date().toISOString(),...x};S.txns.push(t);return t;};
window.alert=m=>{
  const se=document.getElementById('seov');if(se){let e=document.getElementById('semsg');if(!e){e=document.createElement('div');e.id='semsg';e.style.cssText='background:#fde2e2;color:#b00020;padding:10px;border-radius:10px;margin:8px 0;font-weight:600';se.prepend(e);}e.textContent=String(m);return;}
  const msg=String(m),md=document.getElementById('modal'),box=document.getElementById('box');
  if(md&&md.classList.contains('show')&&box){
    let e=document.getElementById('mmsg');
    if(!e){e=document.createElement('div');e.id='mmsg';e.style.cssText='background:#fde2e2;color:#b00020;padding:10px 12px;border-radius:10px;margin:10px 0;font-size:14px;font-weight:600';box.appendChild(e);}
    e.textContent=msg;e.scrollIntoView({block:'nearest'});
  }else toast(msg);
};
let view='dash',cart=[],__save=()=>{};

const TABS=[['dash','HOME','🏠'],['cash','CASH','💵'],['bank','BANK','🏦'],['sales','SALES','🧾'],['purchase','PURCHASE','🛒'],['expenses','EXPENSES','💸'],['customers','CUSTOMERS','👥'],['suppliers','SUPPLIERS','🚚'],['products','PRODUCTS','📦'],['stock','STOCK','📊'],['investment','INVESTMENT','💹'],['shares','SHARES','📈'],['pl','PROFIT & LOSS','📑']];

function openParty(k,id){window.__pk=k;window.__pid=id;view='pdetail';render();}
function ledgerRows(list){
  return list.length?list.map(r=>`<div onclick="editTx('${r.id}')" style="display:grid;grid-template-columns:1.4fr 1fr 1fr;align-items:center;padding:8px 0;border-bottom:1px solid #eee;font-size:13px;cursor:pointer">
    <div><div style="color:var(--mut);font-size:12px">${esc(r.when)}</div><span style="display:inline-block;margin-top:4px;background:#fde8e8;color:#b00020;border-radius:6px;padding:2px 6px;font-size:12px">Bal. ${fmt(r.after)}</span></div>
    <div style="text-align:right;color:#d62828;font-weight:600">${r.give?fmt(r.give):''}</div>
    <div style="text-align:right;color:#16a34a;font-weight:600">${r.got?fmt(r.got):''}</div></div>`).join(''):'<p style="color:var(--mut);margin-top:12px">Koi entry nahi</p>';
}
function custSearch(q){
  q=(q||'').trim().toLowerCase();
  const list=(window.__led||[]).filter(r=>!q||r.when.toLowerCase().includes(q)||String(r.give||r.got).includes(q));
  $('ledger').innerHTML=ledgerRows(list);
}
function openFreeEntry(id,dir){
  const c=S.customers.find(x=>x.id==id);if(!c)return;
  form('Free entry: '+c.name,[
    {k:'t',l:'Type',o:[['-1','Aapne diye (cash bahar)'],['1','Aapko mile (cash andar)']],v:String(dir||-1)},
    {k:'a',l:'Amount (Rs)',t:'number',v:''},
    {k:'m',l:'Cash / Bank',o:ACC,v:'cash'},
    {k:'n',l:'Note (optional)',v:''}],v=>{
    const a=+v.a,d=+v.t;
    if(!(a>0))return alert('Amount likhein');
    if(d<0&&S[v.m]<a)return alert('Itne paise '+v.m+' mein nahi hain');
    money(v.m,d*a);if(d<0)c.bal+=a;
    addTx('adjust',a,v.m,c.name,{pid:c.id,dir:d,free:true,rv:d<0,note:v.n||''});
    save();closeM();render();
  });
}
function custSale(id){
  const c=S.customers.find(x=>x.id==id);if(!c)return;
  view='sales';window.__inl='sale';cart=[];render();
  setTimeout(()=>{$('ptyq').value=c.name;$('pty').value=c.id;fillRate();drawCart('sale');},0);
}
function custPage(p){
  const rows=S.txns.filter(t=>t.party==p.name&&(t.type=='sale'||t.type=='receipt'||(t.type=='adjust'&&t.pid==p.id))).map(t=>{
    const adj=t.type=='adjust';
    const give=adj?(t.dir<0?t.total:0):t.type=='sale'?(t.due!==undefined?t.due:(t.method=='credit'?t.total:0)):0;
    const got=adj?(t.dir>0?t.total:0):t.type=='receipt'?t.total:0;
    const when=(t.day||'')+(t.date?' • '+new Date(t.date).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):'');
    return {id:t.id,when,give,got,delta:adj?0:give-got};
  }).filter(r=>r.give||r.got);
  let bal=p.bal;
  const out=rows.slice().reverse().map(r=>{const row={...r,after:bal};bal-=r.delta;return row;});
  window.__led=out;
  const head=p.bal>0?'Aapko mile ge':p.bal<0?'Aapne dene hain':'Koi baqi nahi';
  const col=p.bal>0?'#d62828':p.bal<0?'#16a34a':'#111827';
  return `<div class="row" style="justify-content:space-between"><button class="btn ghost" onclick="view='customers';render()">← Back</button><b>${esc(p.name)}</b><button class="btn ghost" onclick="editParty('c','${p.id}')">Edit</button></div>
  <div class="card" style="margin-top:12px"><small style="color:var(--mut)">${head}</small><b style="display:block;font-size:24px;color:${col}">${fmt(Math.abs(p.bal))}</b></div>
  <button class="btn ghost" style="width:100%;margin-top:10px" onclick="formPay('c','${p.id}')">Udhaar receive karein</button>
  <div class="row" style="margin-top:10px"><button class="btn ghost" onclick="sendSMS('c','${p.id}')">SMS bhejein</button><button class="btn ghost" onclick="sendWA('c','${p.id}')">WhatsApp</button></div>
  <input placeholder="Talash krein" oninput="custSearch(this.value)" style="width:100%;margin-top:12px">
  <div style="display:grid;grid-template-columns:1.4fr 1fr 1fr;margin-top:12px;font-size:12px;color:var(--mut);font-weight:600"><span>Entries</span><span style="text-align:right">AAPNE DIYE</span><span style="text-align:right">AAPKO MILE</span></div>
  <small style="color:var(--mut)">Entry par tap karke edit ya delete karein</small>
  <div id="ledger">${ledgerRows(out)}</div>
  <div style="position:sticky;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;background:var(--bg,#f2f4f7);padding:8px 0">
    <button onclick="openFreeEntry('${p.id}',-1)" style="border:0;border-radius:24px;padding:14px;font-size:16px;font-weight:600;color:#fff;background:linear-gradient(90deg,#7f1d1d,#b91c1c)">AAPNE DIYE</button>
    <button onclick="openFreeEntry('${p.id}',1)" style="border:0;border-radius:24px;padding:14px;font-size:16px;font-weight:600;color:#fff;background:linear-gradient(90deg,#14532d,#16a34a)">AAPKO MILE</button>
  </div>`;
}
function partyPage(){
  const k=window.__pk,p=(k=='c'?S.customers:S.suppliers).find(x=>x.id==window.__pid);
  if(!p){view='suppliers';return '';}
  if(k=='c')return custPage(p);
  const txs=S.txns.filter(t=>t.party==p.name).slice().reverse().slice(0,50);
  const lbl=k=='c'?'Receivable':'Payable';
  return `<div class="row" style="justify-content:space-between"><button class="btn ghost" onclick="view='${k=='c'?'customers':'suppliers'}';render()">← Back</button><b>${esc(p.name)}</b><span></span></div>
  <div class="card" style="margin-top:10px"><small>${lbl}</small><b class="${k=='c'?'pos':'neg'}">${fmt(p.bal)}</b></div>
  <div class="row" style="margin-top:10px"><button class="btn" style="background:#000;color:#fff;border:0" onclick="formPay('${k}','${p.id}')">${k=='c'?'Receive':'Pay'}</button>${k=='s'?`<button class="btn ghost" onclick="rateMgr('${p.id}')">Rates</button>`:''}<button class="btn ghost" onclick="sendSMS('${k}','${p.id}')">SMS</button><button class="btn ghost" onclick="sendWA('${k}','${p.id}')">WhatsApp</button><button class="btn ghost" onclick="editParty('${k}','${p.id}')">Edit</button></div>
  <h3>Transactions</h3>
  ${txs.length?`<table>${txs.map(t=>`<tr><td>${(t.day||'')}</td><td>${esc(t.type)}</td><td>${esc(t.method||'')}</td><td style="text-align:right">${fmt(t.total)}</td></tr>`).join('')}</table>`:'<p style="color:var(--mut)">Koi transaction nahi</p>'}`;
}
function sharesBlock(c){
  return `<div class="row">Authorized shares: <input id="auth" type="number" value="${S.auth}" style="width:120px"><button class="btn" onclick="setAuth($('auth').value);render()">Save</button></div>
    <p>Issued: ${c.issued} · Share price: ${fmt(c.price)}</p>
    <div class="row"><button class="btn" onclick="formIssue()">Issue shares</button><button class="btn ghost" onclick="formSell()">Sell shares</button><button class="btn ghost" onclick="formDivide()">Shares mein divide karein</button><button class="btn" onclick="openDist()">Distribute Profit</button></div>
    <table><tr><th>Shareholder</th><th>Shares</th><th>Owner %</th><th>Value</th></tr>
    ${S.holders.map(h=>`<tr><td>${h.name}</td><td>${h.n}</td><td>${c.issued?(h.n/c.issued*100).toFixed(2):0}%</td><td>${fmt(h.n*c.price)}</td></tr>`).join('')}</table>`;
}
function calc(){
  const T=S.txns,ty=t=>T.filter(x=>x.type==t),tot=l=>sum(l.map(x=>x.total));
  const sales=ty('sale').filter(x=>!x.free),freeAdj=sum(ty('sale').filter(x=>x.free).map(x=>x.total))+sum(ty('adjust').filter(x=>x.dir>0).map(x=>x.total))-sum(ty('buyback').map(x=>x.total)),rev=tot(sales),cogs=sum(sales.map(x=>x.cogs)),exp=tot(ty('expense'));
  const capital=tot(ty('capital')),wd=tot(ty('withdrawal'));
  const dist=tot(ty('distribution'))-tot(ty('distrev'));const profit=rev-cogs-exp,equity=capital+profit-wd-dist+freeAdj;
  const stock=sum(S.products.map(p=>p.stock*p.buy)),recv=sum(S.customers.map(c=>c.bal)),pay=sum(S.suppliers.map(s=>s.bal));
  const cb=S.cash+S.bank,worth=cb+stock+recv-pay;
  const tt=T.filter(x=>x.day==todayKey());
  const tp=sum(tt.filter(x=>x.type=='sale'&&!x.free).map(x=>x.total-x.cogs))-sum(tt.filter(x=>x.type=='expense').map(x=>x.total));
  const issued=sum(S.holders.map(h=>h.n)),price=issued?(equity+dist)/issued:1;
  return {rev,cogs,exp,capital,wd,profit,equity,stock,recv,pay,cb,worth,tp,issued,price,retained:profit-wd,dist,distributable:Math.max(0,profit-wd)};
}

function cards(c){
  if(view!='dash'){$('cards').innerHTML='';return;}
  const cd=(l,v,cls='')=>`<div class="card"><small>${l}</small><b class="${cls}">${v}</b></div>`;
  const pct=c.tp/Math.max(c.capital,1)*100;
  $('cards').innerHTML=dashLogo()+`<div class="hero" onclick="go('shares')" style="cursor:pointer"><div class="hl">SHARE PRICE</div><div class="hv">Rs ${c.price.toFixed(2)}</div>
  <span class="hp ${c.tp>=0?'pos':'neg'}">${c.tp>=0?'▲':'▼'} ${fmt(Math.abs(c.tp))} (${pct.toFixed(2)}%) today</span>
  <div class="hrow"><div><small>Invested</small><b>${fmt(c.capital)}</b></div><div><small>Buying Power</small><b>${fmt(S.cash)}</b></div></div></div>
  <div class="grid3"><div class="card"><small>Stock Value</small><b>${fmt(c.stock)}</b><small style="display:block;color:var(--mut)">Expected profit: <b class="pos" style="font-size:12px">${fmt(sum(S.products.map(p=>p.stock*(p.sell-p.buy))))}</b></small><small style="display:block;color:var(--mut)">All-time purchase: <b style="font-size:12px;color:#d4a017">${fmt(sum(S.txns.filter(t=>t.type=='purchase').map(t=>t.total)))}</b></small></div><div class="card"><small>All time profit</small><b class="${c.rev-c.cogs>=0?'pos':'neg'}">${fmt(c.rev-c.cogs)}</b><small style="display:block;color:var(--mut)">All-time sale: <b style="font-size:12px;color:#d4a017">${fmt(c.rev)}</b></small><small style="display:block;color:var(--mut)">Expenses: <b class="neg" style="font-size:12px">${fmt(c.exp)}</b></small><small style="display:block;color:var(--mut)">Distributed: <b style="font-size:12px">${fmt(c.dist)}</b></small></div>${cd('Receivables',fmt(c.recv),'pos')}${cd('Payables',fmt(c.pay),'neg')}</div>`;
}
function oldCards(c){
  const cd=(l,v,cls='')=>`<div class="card"><small>${l}</small><b class="${cls}">${v}</b></div>`;
  $('cards').innerHTML=
    cd('Net Worth',fmt(c.worth),c.worth>=0?'pos':'neg')+
    cd('Total Business Investment',fmt(c.capital))+
    cd('Current Business Valuation',fmt(c.equity))+
    cd('Total Share Value',fmt(c.issued*c.price))+
    cd("Today's P/L",`${fmt(c.tp)} <small>(${(c.tp/Math.max(c.capital,1)*100).toFixed(2)}%)</small>`,c.tp>=0?'pos':'neg')+
    cd('Cash & Bank',fmt(c.cb))+

}

const tbl=l=>l.length?`<table><tr><th>Date</th><th>Type</th><th>Party</th><th style="text-align:right">Amount</th><th></th></tr>${l.slice(0,50).map(t=>`<tr><td>${dstr(t.date)}</td><td>${t.type}</td><td>${t.party||''}</td><td style="text-align:right">${fmt(t.total)}<br><small>${t.method||''}</small></td><td><button class="btn ghost" onclick="editTx('${t.id}')">Edit</button></td></tr>`).join('')}</table>`:'<p style="color:var(--mut)">No records yet.</p>';
const kind=(...ts)=>S.txns.filter(t=>ts.includes(t.type)).reverse();

function partyTable(k){
  const isC=k=='c', ALL=isC?S.customers:S.suppliers;
  const pf=window.__pf||{f:'all',s:'new'};
  let L=ALL.slice();
  if(pf.f=='lene')L=L.filter(p=>p.bal>0);
  else if(pf.f=='dene')L=L.filter(p=>p.bal<0);
  else if(pf.f=='bar')L=L.filter(p=>Math.abs(p.bal)<0.001);
  if(pf.s=='new')L.reverse();
  else if(pf.s=='big')L.sort((a,b)=>Math.abs(b.bal)-Math.abs(a.bal));
  else if(pf.s=='small')L.sort((a,b)=>Math.abs(a.bal)-Math.abs(b.bal));
  else if(pf.s=='az')L.sort((a,b)=>a.name.localeCompare(b.name));
  else if(pf.s=='za')L.sort((a,b)=>b.name.localeCompare(a.name));
  const owedToUs=sum(S.customers.filter(x=>x.bal>0).map(x=>x.bal));
  const weOwe=sum(S.suppliers.filter(x=>x.bal>0).map(x=>x.bal));
  const tab=(key,label)=>`<button onclick="go('${key}')" style="background:none;border:0;color:#fff;font-size:16px;padding:8px 2px;opacity:${(key=='customers')==isC?1:.7};border-bottom:${(key=='customers')==isC?'3px solid #fde68a':'3px solid transparent'}">${label}</button>`;
  const ini=n=>(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
  const rowsH=L.map(p=>{
    const last=S.txns.filter(t=>t.party==p.name).slice(-1)[0];
    const when=last?dstr(last.date||last.day):'';
    const amtCol=p.bal>0?(isC?'#dc2626':'#16a34a'):'#6b7280';
    const lbl=p.bal>0?(isC?'Aapko milenge':'Aapko denge'):'Hisaab barabar';
    return `<div data-n="${p.name}" onclick="openParty('${k}','${p.id}')" style="display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #eee;cursor:pointer">
      <div onclick="event.stopPropagation();pickPartyPic('${k}','${p.id}')" style="width:46px;height:46px;border-radius:12px;background:#eef0f3;display:flex;align-items:center;justify-content:center;font-weight:700;color:#555;flex:0 0 auto;overflow:hidden;cursor:pointer">${p.pic?`<img src="${p.pic}" style="width:46px;height:46px;object-fit:cover">`:ini(p.name)}</div>
      <div style="flex:1;min-width:0"><div data-keep style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.name}</div><small style="color:var(--mut)">${when}</small></div>
      <div style="text-align:right;flex:0 0 auto"><b style="color:${amtCol}">${fmt(Math.abs(p.bal))}</b><br><small style="color:var(--mut)">${lbl}</small></div>
    </div>`;
  }).join('');
  return `<div style="background:linear-gradient(90deg,#e8462a,#f29a2e);margin:-12px -12px 0;padding:12px 14px 10px;border-radius:0 0 18px 18px">
    <div class="row" style="justify-content:space-between;color:#fff;gap:8px">
      <button onclick="go('dash')" style="background:none;border:0;color:#fff;font-size:22px">←</button>
      <b style="font-size:20px;color:#fff">Party</b>
      <div style="display:flex;gap:6px"><button onclick="importParties('${k}')" style="background:#fff3;border:0;color:#fff;border-radius:10px;padding:8px 10px">Import</button><button onclick="pdfReport('${k}')" style="background:#fff3;border:0;color:#fff;border-radius:10px;padding:8px 12px">PDF</button></div>
    </div>
    <div style="display:flex;gap:18px;margin-top:6px">${tab('customers','Customers')}${tab('suppliers','Suppliers')}</div>
  </div>
  <div style="background:#fff;border-radius:14px;margin-top:14px;padding:12px;display:flex;justify-content:space-around;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08)">
    <div><b style="color:#16a34a;font-size:18px">${fmt(weOwe)}</b><br><small style="color:var(--mut)">Aapko dene hain</small></div>
    <div style="border-left:1px solid #eee"></div>
    <div><b style="color:#dc2626;font-size:18px">${fmt(owedToUs)}</b><br><small style="color:var(--mut)">Aapko mile ge</small></div>
  </div>
  <div class="row" style="margin-top:12px"><input placeholder="${ALL.length} ${isC?'Customers':'Suppliers'}" oninput="fl(this.value)" style="flex:1"><button onclick="openPartyFilter('${k}')" style="border:0;background:#fff;border-radius:10px;padding:10px 12px;color:#e8462a;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.1)">Filter</button></div>
  <div style="margin-top:6px">${rowsH||'<p style="color:var(--mut)">Abhi koi nahi</p>'}</div>
  <button onclick="formParty('${k}')" style="position:fixed;right:16px;bottom:150px;z-index:20;border:0;border-radius:28px;padding:14px 18px;background:linear-gradient(90deg,#e8462a,#f29a2e);color:#fff;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.2)">+ ${isC?'ADD CUSTOMER':'ADD SUPPLIER'}</button>`;
}

const V={
  dash:c=>V.investment(c).replace(sharesBlock(c),''),
  cash:c=>`<h3>Cash in hand: ${fmt(S.cash)} · Bank: ${fmt(S.bank)}</h3><div class="row"><button class="btn ghost" onclick="openImport()">Statement import (CSV)</button></div><h3>Bank accounts</h3><div class="row"><button class="btn" onclick="formBank()">+ Bank account</button></div>${bankList()}
    <div class="row"><button class="btn" onclick="formMoney('transfer')">Transfer cash↔bank</button><button class="btn" onclick="formMoney('withdrawal')">Owner withdrawal</button><button class="btn" onclick="formMoney('capital')">Add capital</button></div>

    <table><tr><th>Product</th><th>Stock</th><th>Buy</th><th>Sell</th><th></th></tr>
    ${S.products.map(p=>`<tr data-n="${p.name} ${p.cat}"><td>${p.img?`<img src="${p.img}" style="width:32px;height:32px;border-radius:6px;object-fit:cover;vertical-align:middle;margin-right:6px">`:''}<b>${p.name}</b><br><small>${p.cat} · ${p.unit}</small></td><td class="${p.stock<=p.min?'low':''}">${p.stock}</td><td>${fmt(p.buy)}</td><td>${fmt(p.sell)}</td><td><button class="btn ghost" onclick="formProd('${p.id}')">Edit</button></td></tr>`).join('')}</table>`,
  stock:c=>`<h3>Stock valuation: ${fmt(c.stock)}</h3><h3>Low-stock alerts</h3>
    ${S.products.filter(p=>p.stock<=p.min).map(p=>`<div class="row low">⚠ ${p.name}: ${p.stock} ${p.unit} (min ${p.min})</div>`).join('')||'<p>All stock levels OK.</p>'}`,
  investment:c=>`<div class="grid3" style="margin-top:0">
    
    <div class="card"><small>Realized net profit</small><b class="${c.profit>=0?'pos':'neg'}">${fmt(c.profit)}</b></div>
    <div class="card"><small>Retained profit</small><b>${fmt(c.retained)}</b></div>
    
    <div class="card"><small>Total business equity</small><b>${fmt(c.equity)}</b></div>
    <div class="card"><small>Available cash</small><b>${fmt(S.cash)}</b></div></div>
    ${sharesBlock(c)}`,
  shares:c=>candles(),
  pl:c=>`<table>
    <tr><td>Sales revenue</td><td>${fmt(c.rev)}</td></tr>
    <tr><td>Cost of goods sold</td><td>−${fmt(c.cogs)}</td></tr>
    <tr><td><b>Gross profit</b></td><td>${fmt(c.rev-c.cogs)}</td></tr>
    <tr><td>Expenses</td><td>−${fmt(c.exp)}</td></tr>
    <tr><td><b>Realized net profit</b></td><td class="${c.profit>=0?'pos':'neg'}">${fmt(c.profit)}</td></tr></table>
    <h3>Balance sheet</h3><table>
    <tr><td>Cash & bank</td><td>${fmt(c.cb)}</td></tr>
    <tr><td>Stock</td><td>${fmt(c.stock)}</td></tr>
    <tr><td>Receivables</td><td>${fmt(c.recv)}</td></tr>
    <tr><td>Payables</td><td>−${fmt(c.pay)}</td></tr>
    <tr><td><b>Equity</b></td><td>${fmt(c.equity)}</td></tr></table>
    <p style="color:var(--mut)">Balance check: ${Math.abs(c.worth-c.equity)<1?'Balanced ✓':'MISMATCH'}</p>
    <div class="row"><button class="btn" onclick="csv()">Export transactions CSV</button></div>`
};
V.more=c=>`<h3>All sections</h3><div class="grid3" style="grid-template-columns:1fr 1fr 1fr"><div class="card" onclick="go('activity')" style="text-align:center;cursor:pointer"><div style="font-size:22px">🧾</div><small>ALL ACTIVITY</small></div><div class="card" onclick="go('dist')" style="text-align:center;cursor:pointer"><div style="font-size:22px">💰</div><small>PROFIT DIST.</small></div><div class="card" onclick="go('brand')" style="text-align:center;cursor:pointer"><div style="font-size:22px">🎨</div><small>APP BRANDING</small></div>${TABS.slice(1).map(([k,l,i])=>`<div class="card" onclick="go('${k}')" style="text-align:center;cursor:pointer"><div style="font-size:22px">${i}</div><small>${l}</small></div>`).join('')}</div>
<h3>Data</h3><div class="row"><button class="btn" onclick="backup()">Backup</button><button class="btn ghost" onclick="restoreData()">Restore backup</button><button class="btn" onclick="csv()">Export CSV</button><button class="btn ghost" onclick="demo()">Demo data</button><button class="btn" style="background:var(--r)" onclick="reset()">Reset</button></div>`;
V.activity=c=>`<h3>Tamam entries</h3><table><tr><th>Date</th><th>Type</th><th>Party</th><th style="text-align:right">Amount</th><th></th></tr>${S.txns.slice().reverse().map(t=>`<tr onclick="goOrigin('${t.id}')" style="cursor:pointer"><td>${dstr(t.date)}</td><td>${t.type}</td><td>${t.party||''}</td><td style="text-align:right">${fmt(t.total)}<br><small>${t.method||''}</small></td></tr>`).join('')}</table>`;
V.bank=c=>V.cash(c);

function render(){
  const c=calc();cards(c);
  $('nav').innerHTML=TABS.map(([k,l,i])=>`<button class="${k==view?'on':''}" onclick="go('${k}')">${i} ${l}</button>`).join('');
  $('main').innerHTML=V[view](c);
  const G={dash:'dash',investment:'dash',customers:'customers',sales:'sales',purchase:'sales',cash:'cash',bank:'cash'},g=G[view]||'more';
  $('bnav').innerHTML=[['dash','🏠','Home'],['customers','👥','Customers'],['sales','⇄','Trade'],['cash','👛','Wallet'],['more','☰','More']].map(([k,i,l])=>`<button class="${g==k?'on':''}" onclick="go('${k}')"><i>${i}</i>${l}</button>`).join('');
}
function go(k){
  const fromOther=!['sales','purchase'].includes(view);
  view=k;
  if(k=='sales'&&fromOther){window.__inl='sale';cart=[];}
  render();
  if((k=='sales'&&window.__inl=='sale')||(k=='purchase'&&window.__inl=='purchase'))setTimeout(()=>{fillRate();drawCart(window.__inl);},0);
}
function fl(q){q=q.toLowerCase();document.querySelectorAll('[data-n]').forEach(r=>r.style.display=r.dataset.n.toLowerCase().includes(q)?'':'none');}

// ---------- modal helpers ----------
function openModal(title,body){$('box').innerHTML=`<div class="row" style="justify-content:space-between"><b>${title}</b><button class="btn" style="padding:6px 12px" onclick="__save()">Save</button><button class="btn ghost" onclick="closeM()">✕</button></div>${body}`;if(window.__fullBox)$('box').style.cssText='max-height:100vh;height:100vh;border-radius:0;max-width:none;';$('modal').classList.add('show');}
function closeM(){window.__canSave=false;window.__fullBox=false;$('box').style.cssText='';$('modal').classList.remove('show');}
$('modal').onclick=e=>{if(e.target.id=='modal')closeM();};
function form(title,fields,onSave,extra=''){
  window.__canSave=true;
  openModal(title,fields.map(f=>`<div style="margin:6px 0"><small style="color:var(--mut)">${f.l}</small><br>${f.o?`<select id="f_${f.k}" style="width:100%">${f.o.map(o=>`<option value="${o[0]}" ${o[0]==f.v?'selected':''}>${o[1]}</option>`).join('')}</select>`:`<input id="f_${f.k}" type="${f.t||'text'}" value="${f.v??''}" style="width:100%" ${f.dl?`list="dl_${f.k}"`:''}>${f.dl?`<datalist id="dl_${f.k}">${f.dl.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`:''}`}</div>`).join('')+extra+`<button class="btn" style="width:100%;margin-top:10px" onclick="__save()">Save</button>`);
  __save=()=>{const v={};fields.forEach(f=>v[f.k]=$('f_'+f.k).value);onSave(v);};
}
const ACC=[['cash','Cash'],['bank','Bank']];

// ---------- products ----------
function formProd(pid){
  __pimg=null;
  const p=S.products.find(x=>x.id==pid)||{name:'',cat:'Papad',unit:'pkt',buy:0,sell:0,stock:0,min:5};
  form(pid?'Edit product':'New product',[
    {k:'name',l:'Name (English / Urdu)',v:p.name},{k:'cat',l:'Category',o:catOpts(p.cat),v:p.cat},{k:'unit',l:'Unit',o:[...new Set(['pkt','ctn','box',p.unit])].map(u=>[u,u]),v:p.unit},
    {k:'buy',l:'Purchase price',t:'number',v:p.buy},{k:'sell',l:'Selling price',t:'number',v:p.sell},
    {k:'stock',l:'Current stock',t:'number',v:p.stock},{k:'min',l:'Low-stock alert at',t:'number',v:p.min}],
  v=>{
    const x={name:v.name.trim(),cat:v.cat,unit:v.unit,buy:+v.buy||0,sell:+v.sell||0,stock:+v.stock||0,min:+v.min||0,img:__pimg||(pid?p.img:'')||''};
    if(!x.name)return alert('Name required');
    const old=pid?{buy:p.buy,stock:p.stock}:{buy:0,stock:0};
    const delta=x.stock*x.buy-old.stock*old.buy;
    if(pid)Object.assign(p,x);else S.products.push({id:uid(),...x});
    if(Math.abs(delta)>0.001)addTx('capital',delta,'stock','Stock adjustment: '+x.name);
    save();closeM();render();
  },`<div class="row"><small style="color:var(--mut)">Photo</small><input type="file" accept="image/png,image/jpeg,image/webp" onchange="pimgSel(this)"><img id="pprev" src="${p.img||''}" style="width:44px;height:44px;border-radius:8px;object-fit:cover"></div>`+(pid?`<button class="btn danger" onclick="delProd('${pid}')">Delete product</button>`:''));
}
function delProd(pid){
  const p=S.products.find(x=>x.id==pid);if(!p)return;
  if(!confirm('Delete '+p.name+'? Its stock value is written off against capital.'))return;
  const d=-p.stock*p.buy;if(Math.abs(d)>0.001)addTx('capital',d,'stock','Written off: '+p.name);
  S.products=S.products.filter(x=>x.id!=pid);save();closeM();render();
}

function tradeTabs(k){
  const on=k=='purchase';
  return `<div style="position:relative;display:flex;background:#e6e9ef;border-radius:24px;padding:4px;margin:0 0 12px;user-select:none">
  <div id="tabind" style="position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:20px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15);transition:transform .25s ease;transform:translateX(${(window.__tabFrom?window.__tabFrom=='purchase':on)?'100%':'0'})"></div>
  <button onclick="switchTrade('sale')" style="flex:1;position:relative;border:0;background:none;padding:8px;font-weight:600;color:${on?'#6b7280':'#111827'}">Sale</button>
  <button onclick="switchTrade('purchase')" style="flex:1;position:relative;border:0;background:none;padding:8px;font-weight:600;color:${on?'#111827':'#6b7280'}">Purchase</button>
  </div>`;
}
function switchTrade(k){
  if(window.__inl===k)return;
  const ind=document.getElementById('tabind');
  if(ind)ind.style.transform=k=='purchase'?'translateX(100%)':'translateX(0)';
  const apply=()=>{
    view=k=='sale'?'sales':'purchase';window.__inl=k;cart=[];
    render();
    setTimeout(()=>{fillRate();drawCart(k);},0);
  };
  if(ind)setTimeout(apply,280);else apply();
}
function openCart(k){

}

function drawPartyList(){
  const k=window.__plk,pool=k=='sale'?S.customers:S.suppliers,lbl=k=='sale'?'Receivable':'Payable';
  const q=(($('plq')||{}).value||'').trim().toLowerCase();
  const list=pool.filter(x=>!q||x.name.toLowerCase().includes(q));
  $('pllist').innerHTML=list.length?list.map(x=>`<div onclick="selPartyFromList('${x.id}')" style="background:#fff;border-radius:12px;padding:14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer"><b>${esc(x.name)}</b><small style="color:var(--mut)">${lbl}: ${fmt(x.bal)}</small></div>`).join(''):'<p style="color:var(--mut)">Nahi mila</p>';

function selPartyFromList(id){
  const pool=window.__plk=='sale'?S.customers:S.suppliers;
  const x=pool.find(y=>y.id==id);if(!x)return;
  $('ptyq').value=x.name;$('pty').value=x.id;
  closePartyList();fillRate();

function closePartyList(){const e=$('plist');if(e)e.remove();}
function pickParty(k){
  const q=($('ptyq').value||'').trim().toLowerCase(),parties=k=='sale'?S.customers:S.suppliers;
  const exact=parties.find(x=>x.name.trim().toLowerCase()==q);
  $('pty').value=exact?exact.id:'';
  fillRate();

function pickQty(pid,d){
  const k=window.__pk2,p=S.products.find(x=>x.id==pid),i=cart.findIndex(l=>l.pid==pid);
  const nq=(i>=0?cart[i].q:0)+d;
  if(d>0&&k=='sale'&&nq>p.stock){window.__pmsg=`Only ${p.stock} in stock`;return drawPicker();}
  if(nq<=0){if(i>=0)cart.splice(i,1);}
  else if(i>=0)cart[i].q=nq;
  else if(k=='purchase'){return openBuyAdd(p.id);}
  else{const pc=k=='sale'?p.sell:((rateOf($('pty')?$('pty').value:'',p.id)||{}).rate||p.buy);cart.push({pid:p.id,name:p.name,q:nq,pc});}
  drawPicker();
}
function setQty(pid,v){
  const k=window.__pk2,p=S.products.find(x=>x.id==pid),i=cart.findIndex(l=>l.pid==pid);
  let n=Math.floor(+v);if(!(n>=0))n=0;
  if(k=='sale'&&n>p.stock)n=p.stock;
  if(n<=0){if(i>=0)cart.splice(i,1);}
  else if(i>=0)cart[i].q=n;
  else{const pc=k=='sale'?p.sell:((rateOf($('pty')?$('pty').value:'',p.id)||{}).rate||p.buy);cart.push({pid:p.id,name:p.name,q:n,pc});}
  drawPicker();
}

function addLine(k){
  const nm=($('prq').value||'').trim().toLowerCase();

function drawCart(k){
  $('lines').innerHTML=cart.map((l,i)=>`<div class="row"><span style="flex:1">${l.name} × ${l.q} @ ${fmt(l.pc)}</span><b>${fmt(l.q*l.pc)}</b><button class="del" onclick="cart.splice(${i},1);drawCart('${k}')">✕</button></div>`).join('');
  const sub=sum(cart.map(l=>l.q*l.pc)),d=k=='sale'&&$('dc')?(+$('dc').value||0):0,tot=sub-d;
  const pdv=$('pd')&&$('pd').value!==''?+$('pd').value:null,pm=$('mth').value;
  const paidP=pdv!==null?Math.min(tot,Math.max(0,pdv)):(pm=='credit'?0:tot),dueP=tot-paidP;
  $('tot').textContent='Total: '+fmt(tot)+(dueP>0?' · Credit: '+fmt(dueP)+' · Paid: '+fmt(paidP):'');
}
function saveCart(k){
  if(!cart.length)return alert('Cart is empty');
  const sale=k=='sale',m=$('mth').value,pid=$('pty').value;
  const total=sum(cart.map(l=>l.q*l.pc))-(sale?(+$('dc').value||0):0);
  if(total<=0)return alert('Invalid total');
  const pool=sale?S.customers:S.suppliers,nm=(($('ptyq')&&$('ptyq').value)||'').trim().toLowerCase();
  const party=pool.find(x=>x.id==pid)||(nm?pool.find(x=>x.name.trim().toLowerCase()==nm):undefined);
  const pdv=$('pd')&&$('pd').value!==''?+$('pd').value:null;
  const paid=pdv!==null?Math.min(total,Math.max(0,pdv)):(m=='credit'?0:total);
  const due=total-paid,pm=m=='credit'?'cash':m;
  if(due>0&&!party)return alert('Credit ke liye '+(sale?'customer':'supplier')+' select karein');
  if(paid>0&&S[pm]<paid&&!sale)return alert('Insufficient '+pm+' balance');
  if(sale)for(const l of cart){const need=sum(cart.filter(x=>x.pid==l.pid).map(x=>x.q));const p=S.products.find(x=>x.id==l.pid);if(need>p.stock)return alert(p.name+': only '+p.stock+' in stock');}
  let cogs=0;
  cart.forEach(l=>{const p=S.products.find(x=>x.id==l.pid);
    if(sale){cogs+=l.q*p.buy;p.stock-=l.q;}
    else{const ns=p.stock+l.q;p.buy=ns?(p.stock*p.buy+l.q*l.pc)/ns:l.pc;p.stock=ns;} // weighted-average cost
  });
  if(paid>0)money(pm,sale?paid:-paid);
  if(due>0&&party)party.bal+=due;
  addTx(k,total,paid>0?pm:'credit',party?party.name:(sale?'Walk-in':'Cash supplier'),{pid:party?party.id:'',items:cart.map(l=>({n:l.name,q:l.q,p:l.pc})),cogs,paid,due});
  if(!sale&&party)updRates(party,cart);
  save();window.__inl=null;cart=[];render();
}

const MS={sale:1,receipt:1,capital:1,purchase:-1,expense:-1,payment:-1,withdrawal:-1,distribution:-1,distrev:1};
const BS={sale:1,purchase:1,receipt:-1,payment:-1};
// fx: undo (s=-1) or apply (s=+1) an entry's effect on cash/bank, party balances and stock
function fx(t,s){
  const a=t.total;
  if(t.type=='buyback'){const h=S.holders.find(x=>x.id==t.pid);if(h)h.n+=t.sh*s;money(t.method,-a*s);return;}
  if(t.type=='adjust'){money(t.method,t.dir*a*s);if(t.dir<0){const cp=S.customers.find(x=>x.id==t.pid||x.name==t.party);if(cp)cp.bal+=a*s;}return;}
  if(t.type=='transfer'){const[f,to]=t.from?[t.from,t.to]:t.method.split('→');money(f,-a*s);money(to,a*s);return;}
  if(t.items)t.items.forEach(l=>{const p=S.products.find(x=>x.id==l.pid||x.name==l.n);if(p)p.stock+=(t.type=='sale'?-1:1)*l.q*s;});
  if((t.type=='sale'||t.type=='purchase')&&(t.paid!==undefined||t.method=='credit')){
    const paid=t.paid!==undefined?t.paid:0,due=t.due!==undefined?t.due:a-paid;
    const L=t.type=='sale'?S.customers:S.suppliers;const pt=L.find(x=>x.id==t.pid||x.name==t.party);
    if(pt&&due)pt.bal+=due*s;
    if(paid&&t.method!='credit')money(t.method,(t.type=='sale'?1:-1)*paid*s);
    return;
  }
  const cred=t.method=='credit';
  if(BS[t.type]!==undefined&&(cred||t.type=='receipt'||t.type=='payment')){const L=(t.type=='sale'||t.type=='receipt')?S.customers:S.suppliers;const p=L.find(x=>x.id==t.pid||x.name==t.party);if(p)p.bal+=BS[t.type]*a*s;}
  if(!cred&&MS[t.type]!==undefined&&t.method!='stock')money(t.method,MS[t.type]*a*s);
}

function csvRow(line){
  const out=[];let cur='',q=false;
  for(const ch of line){if(ch=='"')q=!q;else if(ch==','&&!q){out.push(cur);cur='';}else cur+=ch;}
  out.push(cur);return out.map(x=>x.trim());
}
function impPreview(){
  const lines=($('imptxt').value||'').split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length)return alert('CSV paste karein');
  const rows=lines.map(csvRow);
  const h=rows[0].map(x=>x.toLowerCase());
  const hasHead=h.some(x=>x.includes('date'));
  const idx=(names,def)=>{const i=h.findIndex(x=>names.some(n=>x.includes(n)));return i>=0?i:def;};
  const iD=hasHead?idx(['date'],0):0,iDesc=hasHead?idx(['desc','narr','particular','detail'],1):1;
  const iDr=hasHead?idx(['debit','withdraw','dr'],2):2,iCr=hasHead?idx(['credit','deposit','cr'],3):3;
  const data=hasHead?rows.slice(1):rows;
  const num=v=>parseFloat(String(v||'').replace(/[,\s]/g,''))||0;
  const list=data.map(r=>{
    const dr=num(r[iDr]),cr=num(r[iCr]),amt=dr||cr;
    if(!amt)return null;
    const inflow=!dr&&cr>0;
    const pd=new Date(r[iD]);
    const date=isNaN(pd)?new Date():pd;
    const key=(r[iD]||'')+'|'+(r[iDesc]||'')+'|'+amt+'|'+(inflow?'in':'out');
    return {date,desc:r[iDesc]||'',amt,inflow,type:inflow?'capital':'expense',key};
  }).filter(Boolean);
  if(!list.length)return alert('Koi entry nahi mili. Columns check karein.');
  window.__imp={acct:$('impacc').value,rows:list};
  drawImp();
}
function drawImp(){

function impRun(){
  const I=window.__imp;if(!I)return;
  const acct=I.acct;let done=0,dup=0,skip=0;
  S.imported=S.imported||[];
  I.rows.forEach(r=>{
    if(r.type=='ignore')return;
    if(S.imported.includes(r.key)){dup++;return;}
    const out=r.type=='expense'||r.type=='withdrawal';
    if(out&&S[acct]<r.amt){skip++;return;}
    money(acct,(out?-1:1)*r.amt);
    addTx(r.type,r.amt,acct,r.desc||'Statement',{imported:true});
    S.imported.push(r.key);done++;
  });
  save();closeImp();view='cash';render();
  toast(done+' import hue, '+dup+' pehle se the, '+skip+' balance kam');
}

function importProducts(){

    const lines=(txt||'').split(/\r?\n/).filter(l=>l.trim());

    const rows=lines.map(l=>(l.includes('\t')&&!l.includes(','))?l.split('\t').map(x=>x.trim()):csvRow(l));

    const iS=hasHead?col(['stock'],3):3, iB=hasHead?col(['buy','purchase'],4):4, iSe=hasHead?col(['sell','sale'],5):5;
    const data=hasHead?rows.slice(1):rows;
    const num=v=>parseFloat(String(v||'').replace(/[,\s]/g,''))||0;

    wrap.appendChild(fi);

  }

function goOrigin(id){
  const t=S.txns.find(x=>x.id==id);if(!t)return;
  const cust=S.customers.find(x=>x.id==t.pid)||S.customers.find(x=>x.name==t.party);
  const supp=S.suppliers.find(x=>x.id==t.pid)||S.suppliers.find(x=>x.name==t.party);
  const go2=(v)=>{view=v;window.__inl=null;render();};
  if(t.type=='sale')return editSale(id);
  if(t.type=='purchase')return go2('purchase');
  if(t.type=='receipt'){if(cust)return openParty('c',cust.id);return go2('customers');}
  if(t.type=='payment'){if(supp)return openParty('s',supp.id);return go2('suppliers');}
  if(t.type=='adjust'){if(t.pid&&cust)return openParty('c',cust.id);return go2('cash');}
  if(t.type=='expense')return go2('expenses');
  if(t.type=='capital')return go2(t.sh?'investment':'cash');
  if(t.type=='buyback'||t.type=='sharetx'||t.type=='shares')return go2('investment');
  if(t.type=='withdrawal'||t.type=='transfer'||t.type=='distribution'||t.type=='distrev')return go2('cash');
  return go2('dash');

function saveSaleEdit(){
  const se=window.__se,t=S.txns.find(x=>x.id==se.id);if(!t)return;
  const items=se.items.filter(i=>i.q>0);
  if(!items.length)return alert('Kam se kam ek item rakhein');
  const total=sum(items.map(i=>i.q*i.pc))-(+se.disc||0);
  if(!(total>0))return alert('Total sahi nahi hai');
  const snap=JSON.parse(JSON.stringify(S));
  fx(t,-1);
  const need={};items.forEach(i=>need[i.pid]=(need[i.pid]||0)+i.q);
  for(const pid in need){const p=S.products.find(x=>x.id==pid);if(!p){S=snap;return alert('Product nahi mila');}if(p.stock<need[pid]){const nm=p.name;S=snap;return alert(nm+': stock kam hai');}}
  const party=se.party?S.customers.find(x=>x.name==se.party):null;

  t.party=party?party.name:'Walk-in';t.pid=party?party.id:'';
  t.method=paid>0?pm:'credit';
  t.items=items.map(i=>({pid:i.pid,n:i.name,q:i.q,p:i.pc}));
  t.total=total;
  t.cogs=sum(items.map(i=>i.q*((S.products.find(x=>x.id==i.pid)||{buy:0}).buy)));
  t.paid=paid;t.due=due;
  fx(t,1);

}

const TFMS={'1m':6e4,'5m':3e5,'15m':9e5,'30m':18e5,'1h':36e5,'3h':108e5,'6h':216e5};

function intraday(P,ms,off=0,N=60){
  if(!P.length)return [];
  const pts=P.slice().sort((a,b)=>a.t-b.t),last=Math.floor(Math.max(Date.now(),pts[pts.length-1].t)/ms)*ms-off*ms,start=last-(N-1)*ms;
  let i=0,cur=null;const out=[];
  while(i<pts.length&&pts[i].t<start){cur=pts[i].p;i++;}
  for(let b=start;b<=last;b+=ms){
    const ps=[];
    while(i<pts.length&&pts[i].t<b+ms){ps.push(pts[i].p);i++;}
    if(cur==null&&!ps.length)continue;
    const o=cur==null?ps[0]:cur,c=ps.length?ps[ps.length-1]:o,all=[o,...ps];
    out.push({t:b,d:'',o,c,h:Math.max(...all),l:Math.min(...all)});
    cur=c;
  }
  return out;
}

// ---------- Profit distribution ----------
let __dref=null;
function hpaid(n){return sum(S.txns.filter(t=>t.type=='distribution'||t.type=='distrev').map(t=>{const a=(t.allocs||[]).find(x=>x.n==n);return a?(t.type=='distribution'?1:-1)*a.pay:0;}));}
// Pool = realized profit - previous losses - reserve - payables - owner drawings. Entitlement = ownership % x pool.
function pm(){
  const c=calc(),P=S.pl||{loss:0,reserve:0},pay=sum(S.suppliers.map(s=>s.bal));
  const E=c.profit-P.loss-P.reserve-pay-c.wd,pool=Math.max(0,E),dist=c.dist,undist=E-dist;
  const rows=S.holders.map(h=>{const pct=c.issued?h.n/c.issued:0,ent=pct*pool,paid=hpaid(h.name);return {n:h.name,shares:h.n,pct:pct*100,ent,paid,rem:ent-paid};});
  return {rnp:c.profit,loss:P.loss,reserve:P.reserve,pay,E,pool,dist,undist,distributable:Math.max(0,undist),rows};
}
// Split amount among selected holders in proportion to their remaining payable
function allocate(amt,selNames,P){
  const selRows=P.rows.filter(r=>selNames.includes(r.n)),pos=selRows.map(r=>Math.max(0,r.rem)),tot=sum(pos),pay={};
  selRows.forEach((r,i)=>{pay[r.n]=tot>0?Math.round(amt*pos[i]/tot*100)/100:0;});
  if(selRows.length){const last=selRows[selRows.length-1].n;pay[last]=Math.round((amt-(sum(Object.values(pay))-pay[last]))*100)/100;}
  return P.rows.map(r=>({...r,pay:pay[r.n]||0}));
}
function openDist(){
  if(!S.holders.length)return toast('Pehle shares divide karein');
  __dref=uid();
  openModal('Distribute Profit',`<div class="grid2"><input id="dd" type="date" value="${todayKey()}"><input id="da" type="number" placeholder="Amount" oninput="prevDist()"></div>
  <div class="grid2" style="margin-top:8px"><select id="dm" onchange="prevDist()">${ACC.map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select><div id="dav" style="font-size:12px;color:var(--mut);align-self:center"></div></div>
  <div style="margin-top:8px">${S.holders.map((h,i)=>`<label style="display:block;margin:4px 0"><input type="checkbox" id="hc${i}" checked onchange="prevDist()"> ${h.name} (${h.n} shares)</label>`).join('')}</div>
  <div id="prev" style="margin-top:8px"></div>
  <button class="btn" id="dcon" style="width:100%;margin-top:10px" onclick="confirmDist()">Confirm distribution</button>`);
  prevDist();
}
function selHolders(){return S.holders.filter((h,i)=>$('hc'+i)&&$('hc'+i).checked).map(h=>h.name);}
function prevDist(){
  const P=pm(),amt=+$('da').value||0,m=$('dm').value,sel=selHolders();
  $('dav').textContent='Balance: '+fmt(S[m]);
  const rows=allocate(amt,sel,P).filter(r=>sel.includes(r.n));
  const need=sum(rows.map(r=>Math.max(0,r.rem))),issues=[];
  if(amt>P.distributable+0.001)issues.push('Distributable profit se zyada ('+fmt(P.distributable)+' tak).');
  if(S[m]<amt)issues.push('Is account mein itna balance nahi hai.');
  if(amt>need+0.001)issues.push('Chune gaye shareholders ka baaqi hissa kam hai ('+fmt(need)+').');
  $('prev').innerHTML=`<table><tr><th>Shareholder</th><th>Entitlement</th><th>Remaining</th><th style="text-align:right">Pay now</th></tr>${rows.map(r=>`<tr><td>${r.n}</td><td>${fmt(r.ent)}</td><td>${fmt(r.rem)}</td><td style="text-align:right">${fmt(r.pay)}</td></tr>`).join('')}</table>${issues.map(i=>`<p class="neg">⚠ ${i}</p>`).join('')}`;
  $('dcon').disabled=issues.length>0||!(amt>0)||!sel.length;
}
function confirmDist(){
  if(!__dref)return toast('Ye distribution pehle save ho chuki hai');
  const P=pm(),amt=+$('da').value||0,m=$('dm').value,d=$('dd').value||todayKey(),sel=selHolders();
  const all=allocate(amt,sel,P).filter(r=>sel.includes(r.n));
  if(!(amt>0)||!sel.length)return toast('Amount aur shareholder chunein');
  if(amt>P.distributable+0.001||S[m]<amt||amt>sum(all.map(r=>Math.max(0,r.rem)))+0.001)return toast('Ye amount allow nahi hai');
  S.refs=S.refs||[];if(S.refs.includes(__dref))return toast('Ye distribution pehle save ho chuki hai');
  S.refs.push(__dref);__dref=null;
  const ref='DIST-'+(S.txns.filter(t=>t.type=='distribution').length+1);
  const t=addTx('distribution',amt,m,'Profit distribution',{day:d,date:new Date(d).toISOString(),ref,allocs:all.filter(r=>r.pay>0).map(r=>({n:r.n,pay:r.pay,ent:r.ent}))});
  fx(t,1);save();closeM();render();toast('Profit distribute ho gaya: '+ref);
}
function reverseDist(id){
  const t=S.txns.find(x=>x.id==id);

  fx(r,1);save();render();toast('Distribution reverse ho gayi');
}

// Square crop: zoom (1-4x) and pan (-1..1) on the shorter side of the image
function cropCanvas(img,z,px,py,size){
  const w=img.naturalWidth||img.width,h=img.naturalHeight||img.height,side=Math.min(w,h)/z;
  const sx=(w-side)/2+px*(w-side)/2,sy=(h-side)/2+py*(h-side)/2;
  const cv=document.createElement('canvas');cv.width=cv.height=size;
  cv.getContext('2d').drawImage(img,sx,sy,side,side,0,0,size,size);return cv;
}
function bcrop(){const cv=$('bcv'),i=__bi;if(!cv||!i)return;const g=cv.getContext('2d');g.clearRect(0,0,160,160);g.drawImage(cropCanvas(i.img,i.z,i.x,i.y,160),0,0);}
function bfile(inp){

  const im=new Image();
  im.onload=()=>{if(im.width<64||im.height<64)return toast('Logo bahut chota hai (kam se kam 64px)');
    if(!__bd)__bd=JSON.parse(JSON.stringify(B));
    __bi={img:im,z:1,x:0,y:0};bcrop();toast('Preview dekhein, phir Save karein');};
  im.onerror=()=>toast('Ye file load nahi ho saki');
  im.src=URL.createObjectURL(f);
}

// Product photo: square crop, resized to 160px JPEG to keep storage small
function pimgSel(inp){
  const f=inp.files[0];if(!f)return;
  if(!['image/png','image/jpeg','image/webp'].includes(f.type))return toast('Sirf PNG, JPG, JPEG ya WebP chunein');
  if(f.size>5*1024*1024)return toast('File 5 MB se badi hai');
  const im=new Image();
  im.onload=()=>{const sz=160,cv=document.createElement('canvas');cv.width=cv.height=sz;const s=Math.min(im.width,im.height);cv.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,sz,sz);__pimg=cv.toDataURL('image/jpeg',0.85);$('pprev').src=__pimg;};
  im.onerror=()=>toast('Ye file load nahi ho saki');
  im.src=URL.createObjectURL(f);
}

// Category manager: rename or delete. Delete needs a replacement if products still use it.
function allCats(){S.cats=S.cats||['Papad','Biscuits','Snacks'];return [...new Set([...S.cats,...S.products.map(p=>p.cat)].filter(Boolean))];}

function catEdit(i){

function catDel(i){
  const old=window.__cl[i],used=S.products.filter(p=>p.cat==old).length;

  form('Category delete karein: '+old,[{k:'to',l:used?'Products ke liye nayi category ('+used+' products)':'Replacement (optional)',o:[['','Koi nahi']].concat(others.map(c=>[c,c])),v:others[0]||''}],v=>{

// Supplier rates: each supplier keeps its own rate per product, plus a history of changes
function rateOf(sid,pid){const s=S.suppliers.find(x=>x.id==sid);return s&&s.rates&&s.rates[pid]?s.rates[pid]:null;}
// Purchase cart: fill unit price from the chosen supplier's rate, and show change vs previous rate
function fillRate(){
  if(window.__inl!='purchase')return;
  const p=S.products.find(x=>x.id==$('pr').value);if(!p||!$('rtag'))return;
  const r=rateOf($('pty').value,p.id),cur=r?r.rate:p.buy;
  $('pp').value=cur;
  const prev=r&&r.hist.length>1?r.hist[r.hist.length-2].rate:cur,d=cur-prev;
  $('rtag').innerHTML=r?`Supplier rate: <b>${fmt(cur)}</b> <span class="${d>0?'neg':d<0?'pos':''}">${d>0?'▲':d<0?'▼':'—'} ${fmt(Math.abs(d))}</span>`:`Is supplier ka rate nahi hai, product buy price ${fmt(p.buy)} use hua`;
}
// Every purchase updates the supplier's current rate and records history (only when the rate changes)
function updRates(s,lines){
  s.rates=s.rates||{};const d=new Date().toISOString();
  lines.forEach(l=>{const r=s.rates[l.pid]||{rate:l.pc,hist:[]};
    if(!r.hist.length||r.rate!=l.pc)r.hist=[...r.hist,{rate:l.pc,date:d,src:'purchase'}];
    r.rate=l.pc;s.rates[l.pid]=r;});
}
function rateMgr(sid){
  const s=S.suppliers.find(x=>x.id==sid);if(!s)return;
  openModal(esc(s.name)+' — rates',`<table><tr><th>Product</th><th>Rate</th></tr>${S.products.map((p,i)=>{const r=rateOf(sid,p.id);return `<tr><td>${esc(p.name)}</td><td><input type="number" id="rt${i}" value="${r?r.rate:''}" placeholder="${p.buy}" style="width:110px"><br><small style="color:var(--mut)">${r&&r.hist.length?r.hist.slice(-3).map(h=>fmt(h.rate)).join(' → '):''}</small></td></tr>`;}).join('')}</table><button class="btn" style="width:100%;margin-top:10px" onclick="saveRates('${sid}')">Save rates</button>`);
  $('box').style.cssText='max-height:100vh;height:100vh;border-radius:0;';
}
function saveRates(sid){
  const s=S.suppliers.find(x=>x.id==sid);if(!s)return;
  s.rates=s.rates||{};let n=0;
  S.products.forEach((p,i)=>{const v=$('rt'+i).value;if(v===''||!(+v>0))return;const rate=+v;
    const r=s.rates[p.id]||{rate,hist:[]};
    if(!r.hist.length||r.rate!=rate){r.hist=[...r.hist,{rate,date:new Date().toISOString(),src:'manual'}];n++;}
    r.rate=rate;s.rates[p.id]=r;});
  save();closeM();render();toast(n?n+' rate update ho gaye':'Koi change nahi');
}

// Swipe on the Trade screen: left = Purchase, right = Sale

// Drag the share price chart sideways: only the candles move (price line and price labels stay fixed)
(()=>{
  let sx=0,sy=0,on=false,start=0,svg=null,per=10,moved=false,scale=1;
  document.addEventListener('touchstart',e=>{
    const box=e.target.closest&&e.target.closest('#cbox');
    on=!!box&&e.touches.length===1;moved=false;if(!on)return;
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;start=window.__off||0;
    svg=box.querySelector('svg');
    if(!svg)return;
    const rw=svg.getBoundingClientRect().width||340;
    per=rw/(window.__n||60);
    scale=(svg.viewBox.baseVal.width||340)/rw;
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!on||!svg)return;
    const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
    if(!moved&&Math.abs(dy)>Math.abs(dx))return;
    moved=true;
    const g=document.getElementById('cbody');if(!g)return;
    g.style.transition='none';g.style.transform=`translateX(${dx*scale}px)`;
  },{passive:true});
  document.addEventListener('touchend',e=>{
    if(!on)return;on=false;
    if(!moved||!svg)return;
    const dx=e.changedTouches[0].clientX-sx;
    const steps=Math.round(dx/Math.max(per,1));
    const resid=dx-steps*per;
    window.__off=Math.max(0,start+steps);
    render();
    requestAnimationFrame(()=>{
      const g=document.getElementById('cbody');if(!g)return;
      g.style.transition='none';g.style.transform=`translateX(${resid*scale}px)`;
      void g.getBoundingClientRect();
      g.style.transition='transform .2s ease-out';g.style.transform='translateX(0)';
    });
  },{passive:true});
})();

// Pinch the share price chart with two fingers to zoom in (fewer candles) or out (more candles)
(()=>{
  let d0=0,n0=60,pinch=false,raf=0;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  document.addEventListener('touchstart',e=>{
    if(e.touches.length===2&&e.target.closest&&e.target.closest('#cbox')){
      pinch=true;d0=dist(e.touches);n0=window.__n||60;
    }
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!pinch||e.touches.length!==2)return;
    const r=dist(e.touches)/Math.max(d0,1);
    window.__zn=Math.max(10,Math.min(240,Math.round(n0/r)));
    if(!raf)raf=requestAnimationFrame(()=>{raf=0;render();});
  },{passive:true});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)pinch=false;},{passive:true});
})();

// PC: drag the share price chart with the mouse, zoom with the mouse wheel
(()=>{
  let down=false,moved=false,sx=0,start=0,per=10,scale=1,raf=0;
  document.addEventListener('mousedown',e=>{
    const box=e.target.closest&&e.target.closest('#cbox');
    if(!box||e.button!==0)return;
    e.preventDefault();
    down=true;moved=false;sx=e.clientX;start=window.__off||0;
    const svg=box.querySelector('svg');if(!svg)return;
    const rw=svg.getBoundingClientRect().width||340;
    per=rw/(window.__n||60);scale=(svg.viewBox.baseVal.width||340)/rw;
  });
  document.addEventListener('mousemove',e=>{
    if(!down)return;
    const dx=e.clientX-sx;
    if(Math.abs(dx)>3)moved=true;
    const g=document.getElementById('cbody');
    if(g){g.style.transition='none';g.style.transform=`translateX(${dx*scale}px)`;}
  });
  document.addEventListener('mouseup',e=>{
    if(!down)return;down=false;
    const g=document.getElementById('cbody');
    if(!moved){if(g)g.style.transform='';return;}
    const dx=e.clientX-sx;
    const steps=Math.round(dx/Math.max(per,1));
    const resid=dx-steps*per;
    window.__off=Math.max(0,start+steps);
    render();
    requestAnimationFrame(()=>{
      const gg=document.getElementById('cbody');if(!gg)return;
      gg.style.transition='none';gg.style.transform=`translateX(${resid*scale}px)`;
      void gg.getBoundingClientRect();
      gg.style.transition='transform .2s ease-out';gg.style.transform='translateX(0)';
    });
  });
  document.addEventListener('wheel',e=>{
    const box=e.target.closest&&e.target.closest('#cbox');
    if(!box)return;
    e.preventDefault();
    const n=window.__zn||window.__n||60;
    const f=e.deltaY>0?1.15:1/1.15;
    window.__zn=Math.max(10,Math.min(240,Math.round(n*f)));
    if(!raf)raf=requestAnimationFrame(()=>{raf=0;render();});
  },{passive:false});
})();
